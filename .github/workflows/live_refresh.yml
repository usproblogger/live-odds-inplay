name: Live In-Play Odds Refresh

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Live Odds Fetcher
        env:
          LIVE_ODDS_API_KEY: ${{ secrets.LIVE_ODDS_API_KEY }}
        run: |
          python update_live_odds.py

      - name: Commit and push live feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_odds.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Live in-play odds update" && git push)
